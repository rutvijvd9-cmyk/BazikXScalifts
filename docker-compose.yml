version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: manubhai_crm_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env file}
      POSTGRES_DB: whatsapp_crm
    volumes:
      - crm_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: manubhai_crm_backend
    restart: always
    depends_on:
      - db
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  crm_db_data:
