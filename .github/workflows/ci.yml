name: CI Security & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Security & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: whatsapp_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        env:
          ENVIRONMENT: development
          SECRET_KEY: test_secret_key_for_ci_pipeline_only_32_chars
          APP_ENCRYPTION_KEY: test_encryption_key_for_ci_pipeline_32_chars
          WEBHOOK_SECRET: test_webhook_secret_key_16_chars
          META_APP_SECRET: test_meta_app_secret_16_chars
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/whatsapp_crm_test
          REDIS_URL: redis://localhost:6379/0
          SCHEDULER_ENABLED: false
        run: |
          cd backend
          pytest -v
